<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Listening</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="Now Listening">
    <meta property="og:description" content="@yesA0513">
    <meta property="og:image" content="img/Preview.png">
    <style>
        body { --now-rgb: 16, 17, 20; background: radial-gradient(ellipse 90% 70% at 78% 12%, rgba(var(--now-rgb), .22), transparent 68%), var(--page); transition: background 1.2s ease; }
        body::before { top: -24vw; right: -12vw; width: 62vw; height: 62vw; background: radial-gradient(circle, rgba(var(--now-rgb), .4), transparent 68%); opacity: 0; animation: ambient-drift 16s ease-in-out infinite alternate; transition: opacity 1.1s ease, background 1.1s ease; }
        body.is-playing::before { opacity: .78; }
        @keyframes ambient-drift { 0% { transform: translate3d(-4%, -2%, 0) scale(.94); } 48% { transform: translate3d(8%, 9%, 0) scale(1.08); } 100% { transform: translate3d(-2%, 16%, 0) scale(.98); } }
        @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
        #album-grid { transform: none !important; }
        #song-detail-modal { --artwork-rgb: 16, 17, 20; --modal-accent: var(--accent); }
        .modal-backdrop { background: radial-gradient(circle at 22% 54%, rgba(var(--artwork-rgb), .42), transparent 48%), #101114 !important; }
        .modal-content-new { isolation: isolate; grid-template-columns: minmax(230px, 390px) minmax(280px, 1fr); gap: clamp(42px, 7vw, 104px); width: min(100% - 56px, 1120px); padding: clamp(26px, 4vw, 54px); border: 1px solid rgba(255,255,255,.11); border-radius: 24px; background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: 0 32px 100px rgba(0,0,0,.42); overflow: hidden; }
        .modal-content-new::before { position: absolute; z-index: -1; right: -14%; bottom: -40%; width: 55%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(var(--artwork-rgb), .34), transparent 68%); content: ''; }
        .modal-left { position: relative; }
        #modal-cover { position: relative; border-radius: 14px; box-shadow: 0 20px 48px rgba(0,0,0,.42); }
        .cover-label, .preview-label, .modal-kicker { font-family: 'DM Mono', monospace; font-size: .64rem; letter-spacing: .12em; }
        .cover-label { display: block; margin: 0 0 12px; color: var(--modal-accent); }
        .preview-label { display: block; margin-top: 13px; color: var(--muted); }
        .modal-kicker { margin: 0 0 22px; color: var(--muted); }
        .modal-kicker span { color: var(--modal-accent); }
        #modal-artist-name { margin-bottom: 12px; font-size: .71rem; }
        #modal-song-title { max-width: 650px; }
        .track-rule { width: min(100%, 440px); height: 3px; margin-top: 30px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
        .track-rule span { display: block; width: 31%; height: 100%; border-radius: inherit; background: var(--accent); }
        .player-controls { margin-top: 30px; }
        .modal-close-btn { top: 24px; right: 28px; border-color: rgba(255,255,255,.14); }
        @media (max-width: 620px) { .modal-content-new { grid-template-columns: 1fr; width: min(100% - 32px, 430px); padding: 24px; border-radius: 20px; } .cover-label, .preview-label { text-align: center; } .modal-kicker { margin-bottom: 16px; } .track-rule { margin-inline: auto; } .modal-close-btn { top: 14px; right: 14px; } }
    </style>
    <style>
        .track-timeline { width: min(100%, 440px); margin-top: 30px; }
        .track-rule { width: 100%; height: 4px; margin: 0; appearance: none; border: 0; border-radius: 99px; background: linear-gradient(to right, var(--modal-accent) var(--progress, 0%), rgba(255,255,255,.14) var(--progress, 0%)); cursor: pointer; vertical-align: middle; }
        .track-rule::-webkit-slider-thumb { width: 12px; height: 12px; appearance: none; border: 0; border-radius: 50%; background: var(--modal-accent); box-shadow: 0 0 0 4px rgba(var(--artwork-rgb),.25); }
        .track-rule::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--modal-accent); }
        #song-detail-modal #play-pause-btn { background: var(--modal-accent); box-shadow: 0 0 26px rgba(var(--artwork-rgb), .28); }
        #song-detail-modal #modal-apple-music-link:hover { border-color: var(--modal-accent); color: var(--modal-accent); }
        #play-pause-btn:disabled { cursor: default; opacity: .35; transform: none; box-shadow: none; }
        .track-rule:disabled { cursor: default; opacity: .45; }
        .track-rule:disabled::-webkit-slider-thumb { display: none; }
        .time-labels { display: flex; justify-content: space-between; margin-top: 10px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: .62rem; letter-spacing: .05em; }
        @media (max-width: 620px) { .track-timeline { margin-inline: auto; } }
    </style>
    <style>
        .persistent-player { position: fixed; right: 24px; bottom: 24px; z-index: 90; display: flex; align-items: center; gap: 13px; width: min(390px, calc(100vw - 32px)); padding: 10px; border: 1px solid rgba(255,255,255,.13); border-radius: 16px; color: var(--text); background: rgba(24,26,31,.88); box-shadow: 0 20px 56px rgba(0,0,0,.36); backdrop-filter: blur(18px); transform: translateY(0); opacity: 1; transition: opacity .25s ease, transform .25s ease; }
        .persistent-player.hidden { transform: translateY(18px); opacity: 0; pointer-events: none; }
        #persistent-cover { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 10px; object-fit: cover; }
        .persistent-info { min-width: 0; flex: 1; }.persistent-info p { overflow: hidden; margin: 0; text-overflow: ellipsis; white-space: nowrap; }.persistent-info #persistent-title { font-size: .76rem; font-weight: 800; }.persistent-info #persistent-artist { margin-top: 4px; color: var(--muted); font-size: .66rem; }
        .persistent-controls { display: flex; align-items: center; gap: 2px; }.persistent-controls button { display: grid; width: 33px; height: 33px; place-items: center; padding: 0; border: 0; border-radius: 50%; color: var(--text); background: transparent; cursor: pointer; }.persistent-controls button:hover { background: rgba(255,255,255,.11); }.persistent-controls #persistent-play { color: #101114; background: var(--accent); }.persistent-controls svg { width: 18px; height: 18px; fill: currentColor; }
        @media (max-width: 620px) { .persistent-player { right: 16px; bottom: 16px; } }
    </style>
</head>
<body>
    <svg style="display: none;">
        <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
        <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
        <symbol id="icon-previous" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM18 6v12l-9-6z"/></symbol>
        <symbol id="icon-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6v12l9-6z"/></symbol>
    </svg>

    <main class="app-shell">
        <header class="site-header">
            <a class="brand" href="/" aria-label="Now Listening home"><span class="brand-mark" aria-hidden="true"></span><span>NOW LISTENING</span></a>
            <p id="header-note" class="header-note">A small collection of recent plays</p>
        </header>
        <section class="library" aria-labelledby="library-title">
            <div class="library-heading">
                <div><p class="eyebrow">SOUNDTRACK</p><h1 id="library-title">Recently played.</h1></div>
                <p class="library-count">30 tracks</p>
            </div>
            <div id="album-grid" aria-live="polite"></div>
        </section>
    </main>

    <div id="song-detail-modal" class="hidden">
        <div class="modal-backdrop"></div>
        <button class="modal-close-btn" aria-label="닫기">&times;</button>
        <div class="modal-content-new">
            <div class="modal-left">
                <span class="cover-label">NOW PLAYING</span>
                <img id="modal-cover" src="" alt="Album Cover" crossorigin="anonymous">
                <span class="preview-label">30 SEC PREVIEW</span>
            </div>
            <div class="modal-right">
                <p class="modal-kicker">RECENTLY PLAYED <span aria-hidden="true">·</span> 01</p>
                <p id="modal-artist-name"></p>
                <h2 id="modal-song-title"></h2>
                <p id="modal-album-info"></p>
                <div class="track-timeline">
                    <input id="playback-progress" class="track-rule" type="range" min="0" max="0" value="0" step="0.1" aria-label="재생 위치" disabled>
                    <div class="time-labels"><span id="current-time">0:00</span><span id="duration-time">0:00</span></div>
                </div>
                <div class="player-controls">
                    <audio id="modal-audio"></audio>
                    <button id="play-pause-btn" aria-label="미리듣기 재생"><svg width="24" height="24"><use href="#icon-play"></use></svg></button>
                    <a id="modal-apple-music-link" href="#" target="_blank" rel="noreferrer">Apple Music에서 듣기 <span aria-hidden="true">↗</span></a>
                </div>
            </div>
        </div>
    </div>

    <aside id="persistent-player" class="persistent-player hidden" aria-label="현재 재생 중">
        <img id="persistent-cover" src="" alt="">
        <div class="persistent-info"><p id="persistent-title"></p><p id="persistent-artist"></p></div>
        <div class="persistent-controls">
            <button id="persistent-previous" aria-label="이전 곡"><svg><use href="#icon-previous"></use></svg></button>
            <button id="persistent-play" aria-label="재생 또는 일시정지"><svg><use href="#icon-play"></use></svg></button>
            <button id="persistent-next" aria-label="다음 곡"><svg><use href="#icon-next"></use></svg></button>
        </div>
    </aside>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <script src="setup.js"></script>
</body>
</html>
