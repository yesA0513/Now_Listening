<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Listening</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="Now Listening">
    <meta property="og:description" content="@yesA0513">
    <meta property="og:image" content="img/Preview.png">
    <style>
        body { --now-rgb: 16, 17, 20; background: radial-gradient(ellipse 90% 70% at 78% 12%, rgba(var(--now-rgb), .22), transparent 68%), var(--page); }
        body::before { top:-24vw; right:-12vw; width:62vw; height:62vw; background:radial-gradient(circle,rgba(var(--now-rgb),.4),transparent 68%); opacity:0; animation:ambient-drift 16s ease-in-out infinite alternate; transition:opacity 1.1s ease; }
        body.is-playing::before { opacity:.78; }
        @keyframes ambient-drift { 0% { transform:translate3d(-4%,-2%,0) scale(.94); } 48% { transform:translate3d(8%,9%,0) scale(1.08); } 100% { transform:translate3d(-2%,16%,0) scale(.98); } }
        #album-grid { transform:none !important; }

        #song-detail-modal { --artwork-rgb:16,17,20; --modal-accent:var(--accent); }
        .modal-backdrop { background:radial-gradient(circle at 22% 54%,rgba(var(--artwork-rgb),.42),transparent 48%),#101114 !important; }
        .modal-content-new { isolation:isolate; grid-template-columns:minmax(230px,390px) minmax(310px,1fr); gap:clamp(42px,7vw,104px); width:min(100% - 56px,1120px); padding:clamp(26px,4vw,54px); border:1px solid rgba(255,255,255,.11); border-radius:24px; background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025)); box-shadow:0 32px 100px rgba(0,0,0,.42); overflow:hidden; }
        .modal-content-new.is-switching #modal-cover { animation:cover-dissolve .28s ease-out; }.modal-content-new.is-switching[data-direction="next"] .modal-right > :is(.modal-kicker,#modal-artist-name,#modal-song-title,#modal-album-info) { animation:details-enter-next .34s cubic-bezier(.2,.8,.2,1); }.modal-content-new.is-switching[data-direction="previous"] .modal-right > :is(.modal-kicker,#modal-artist-name,#modal-song-title,#modal-album-info) { animation:details-enter-previous .34s cubic-bezier(.2,.8,.2,1); }
        @keyframes cover-dissolve { 0% { opacity:.45; } 100% { opacity:1; } } @keyframes details-enter-next { from { opacity:.18; transform:translateX(18px); } to { opacity:1; transform:translateX(0); } } @keyframes details-enter-previous { from { opacity:.18; transform:translateX(-18px); } to { opacity:1; transform:translateX(0); } }
        .modal-content-new::before { position:absolute; z-index:-1; right:-14%; bottom:-40%; width:55%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(var(--artwork-rgb),.34),transparent 68%); content:''; }
        .modal-left { position:relative; }.cover-label,.preview-label,.modal-kicker,.volume-label { font-family:'DM Mono',monospace; font-size:.64rem; letter-spacing:.12em; }.cover-label { display:block; margin:0 0 12px; color:var(--modal-accent); }.preview-label { display:block; margin-top:13px; color:var(--muted); }#modal-cover { display:block; width:100%; border-radius:14px; box-shadow:0 20px 48px rgba(0,0,0,.42); }
        .modal-kicker { margin:0 0 22px; color:var(--muted); }.modal-kicker span { color:var(--modal-accent); }#modal-artist-name { margin-bottom:12px; font-size:.71rem; }#modal-song-title { max-width:650px; }#modal-album-info { margin-bottom:0; }
        .track-timeline { width:min(100%,440px); margin-top:30px; }.track-rule { width:100%; height:4px; margin:0; appearance:none; border:0; border-radius:99px; background:linear-gradient(to right,var(--modal-accent) var(--progress,0%),rgba(255,255,255,.14) var(--progress,0%)); cursor:pointer; vertical-align:middle; }.track-rule::-webkit-slider-thumb { width:12px; height:12px; appearance:none; border:0; border-radius:50%; background:var(--modal-accent); box-shadow:0 0 0 4px rgba(var(--artwork-rgb),.25); }.track-rule::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--modal-accent); }.track-rule:disabled { cursor:default; opacity:.45; }.track-rule:disabled::-webkit-slider-thumb { display:none; }.time-labels { display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.05em; }
        .player-controls { display:flex; align-items:center; gap:12px; margin-top:30px; }.transport-controls { display:flex; align-items:center; gap:4px; }.transport-controls button { display:grid; width:38px; height:38px; place-items:center; padding:0; border:0; border-radius:50%; color:var(--text); background:transparent; cursor:pointer; }.transport-controls button:hover { background:rgba(255,255,255,.11); }.transport-controls svg { width:19px; height:19px; fill:currentColor; }#song-detail-modal #play-pause-btn { width:56px; height:56px; color:#101114; background:var(--modal-accent); box-shadow:0 0 26px rgba(var(--artwork-rgb),.28); }#play-pause-btn:disabled { cursor:default; opacity:.35; transform:none; box-shadow:none; }
        .player-utility { display:flex; align-items:center; justify-content:space-between; gap:18px; width:min(100%,440px); margin-top:18px; }.volume-control { display:flex; align-items:center; gap:10px; padding:8px 11px; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(255,255,255,.045); transition:border-color .2s ease,background .2s ease; }.volume-control:focus-within { border-color:color-mix(in srgb,var(--modal-accent) 55%,transparent); background:rgba(255,255,255,.075); }.volume-label { color:var(--muted); font-size:.58rem; }.volume-slider { --volume:80%; width:82px; height:3px; appearance:none; border:0; border-radius:99px; background:linear-gradient(to right,var(--modal-accent) var(--volume),rgba(255,255,255,.18) var(--volume)); cursor:pointer; }.volume-slider::-webkit-slider-thumb { width:11px; height:11px; appearance:none; border:2px solid #17191e; border-radius:50%; background:var(--modal-accent); box-shadow:0 0 0 3px rgba(var(--artwork-rgb),.2); transition:transform .15s ease; }.volume-slider:hover::-webkit-slider-thumb { transform:scale(1.18); }.volume-slider::-moz-range-thumb { width:9px; height:9px; border:2px solid #17191e; border-radius:50%; background:var(--modal-accent); }.modal-external-link { color:var(--muted); font-size:.75rem; font-weight:700; text-decoration:none; transition:color .2s ease; }.modal-external-link:hover { color:var(--modal-accent); }.modal-close-btn { top:24px; right:28px; border-color:rgba(255,255,255,.14); }
        .persistent-player { position:fixed; right:24px; bottom:24px; z-index:90; display:flex; align-items:center; gap:13px; width:min(390px,calc(100vw - 32px)); padding:10px; border:1px solid rgba(255,255,255,.13); border-radius:16px; color:var(--text); background:rgba(24,26,31,.88); box-shadow:0 20px 56px rgba(0,0,0,.36); backdrop-filter:blur(18px); transform:translateY(0); opacity:1; cursor:pointer; transition:opacity .25s ease,transform .25s ease,background .3s ease; }.persistent-player:hover { background:rgba(36,38,45,.94); }.persistent-player.hidden { transform:translateY(18px); opacity:0; pointer-events:none; }#persistent-cover { width:52px; height:52px; flex:0 0 52px; border-radius:10px; object-fit:cover; }.persistent-info { min-width:0; flex:1; }.persistent-info p { overflow:hidden; margin:0; text-overflow:ellipsis; white-space:nowrap; }.persistent-info #persistent-title { font-size:.76rem; font-weight:800; }.persistent-info #persistent-artist { margin-top:4px; color:var(--muted); font-size:.66rem; }.persistent-controls { display:flex; align-items:center; gap:2px; }.persistent-controls button { display:grid; width:33px; height:33px; place-items:center; padding:0; border:0; border-radius:50%; color:var(--text); background:transparent; cursor:pointer; }.persistent-controls button:hover { background:rgba(255,255,255,.11); }.persistent-controls #persistent-play { color:#101114; background:var(--accent); }.persistent-controls svg { width:18px; height:18px; fill:currentColor; }
        @media (prefers-reduced-motion:reduce) { body::before { animation:none; } }
        @media (max-width:620px) { .modal-content-new { grid-template-columns:1fr; width:min(100% - 32px,430px); padding:24px; border-radius:20px; }.cover-label,.preview-label,.modal-right { text-align:center; }.modal-kicker { margin-bottom:16px; }.track-timeline,.player-utility { margin-inline:auto; }.player-controls { justify-content:center; }.modal-close-btn { top:14px; right:14px; }.persistent-player { right:16px; bottom:16px; } }
    </style>
    <style>
        /* Unified liquid-glass player system */
        .modal-backdrop { background: radial-gradient(circle at 20% 50%, rgba(var(--artwork-rgb), .42), transparent 52%), rgba(7, 9, 13, .78) !important; backdrop-filter: blur(26px) saturate(132%); }
        .modal-content-new { border-color: rgba(255,255,255,.2); background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.055) 42%, rgba(255,255,255,.025)); box-shadow: 0 30px 110px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.24); backdrop-filter: blur(28px) saturate(135%); }
        .modal-content-new::after { position:absolute; top:0; left:7%; width:54%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent); content:''; opacity:.65; }
        .modal-left { padding:12px; border:1px solid rgba(255,255,255,.13); border-radius:20px; background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.025)); box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 42px rgba(0,0,0,.16); }
        #modal-cover { border:1px solid rgba(255,255,255,.16); box-shadow:0 20px 42px rgba(0,0,0,.32); }
        .cover-label,.preview-label { padding-inline:3px; }.modal-kicker { color:rgba(255,255,255,.56); }
        .track-timeline { padding:14px 15px 11px; border:1px solid rgba(255,255,255,.1); border-radius:14px; background:rgba(255,255,255,.055); box-shadow:inset 0 1px 0 rgba(255,255,255,.1); }
        .player-controls { margin-top:18px; }.transport-controls { padding:5px; border:1px solid rgba(255,255,255,.1); border-radius:99px; background:rgba(255,255,255,.055); box-shadow:inset 0 1px 0 rgba(255,255,255,.13); }.transport-controls button { border:1px solid transparent; }.transport-controls button:hover { border-color:rgba(255,255,255,.14); background:rgba(255,255,255,.14); }.transport-controls #play-pause-btn { border-color:rgba(255,255,255,.28); color:#11141a; background:linear-gradient(145deg,rgba(255,255,255,.98),var(--modal-accent)); box-shadow:0 8px 20px rgba(var(--artwork-rgb),.24),inset 0 1px 0 rgba(255,255,255,.72); }
        .player-utility { width:min(100%,440px); padding:7px; border:1px solid rgba(255,255,255,.1); border-radius:14px; background:rgba(255,255,255,.04); box-shadow:inset 0 1px 0 rgba(255,255,255,.1); }.volume-control { border-color:transparent; background:rgba(255,255,255,.07); }.volume-control:focus-within { border-color:rgba(255,255,255,.24); background:rgba(255,255,255,.12); }.modal-external-link { display:inline-flex; align-items:center; min-height:34px; padding:8px 11px; border:1px solid transparent; border-radius:10px; color:rgba(255,255,255,.48); background:rgba(255,255,255,.045); font-family:'DM Mono',monospace; font-size:.56rem; font-weight:400; letter-spacing:.045em; }.modal-external-link:hover { border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.09); color:rgba(255,255,255,.8); }
        .modal-close-btn { border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.09); box-shadow:inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(12px); }.modal-close-btn:hover { background:rgba(255,255,255,.18); }
        #song-detail-modal .volume-label,
        #song-detail-modal #modal-apple-music-link.modal-external-link { color:var(--muted); font-family:'DM Mono',monospace; font-size:.58rem; font-weight:400; letter-spacing:.12em; }
        #song-detail-modal #modal-apple-music-link.modal-external-link { gap:6px; min-height:34px; padding:8px 11px; border-color:transparent; background:rgba(255,255,255,.07); }
        #song-detail-modal #modal-apple-music-link.modal-external-link:hover { color:var(--muted); border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.12); }
        .player-utility .volume-control,
        #song-detail-modal #modal-apple-music-link.modal-external-link { height:34px; min-height:34px; padding-block:0; }
        .apple-icon { width:13px; height:13px; flex:0 0 13px; fill:currentColor; }
        .persistent-player { overflow:hidden; border-color:rgba(255,255,255,.19); background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.055)); box-shadow:0 20px 56px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.25); backdrop-filter:blur(24px) saturate(135%); }
        .persistent-player::before { position:absolute; top:0; left:12%; width:54%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.52),transparent); content:''; }.persistent-player:hover { background:linear-gradient(135deg,rgba(255,255,255,.21),rgba(255,255,255,.07)); }
        #persistent-cover { position:relative; border:1px solid rgba(255,255,255,.17); box-shadow:0 8px 18px rgba(0,0,0,.23); }.persistent-info #persistent-title { font-weight:700; }.persistent-info #persistent-artist { color:rgba(255,255,255,.48); font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.05em; }
        .persistent-controls { padding:3px; border:1px solid rgba(255,255,255,.1); border-radius:99px; background:rgba(255,255,255,.06); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }.persistent-controls button:hover { background:rgba(255,255,255,.14); }.persistent-controls #persistent-play { border:1px solid rgba(255,255,255,.25); background:linear-gradient(145deg,rgba(255,255,255,.95),var(--accent)); box-shadow:inset 0 1px 0 rgba(255,255,255,.7); }
        :root { --glass-radius-card:24px; --glass-radius-panel:16px; --glass-radius-control:12px; }
        .modal-content-new,.persistent-player { border-radius:var(--glass-radius-card); }.modal-left { border-radius:20px; }#modal-cover { border-radius:16px; }.track-timeline,.player-utility { border-radius:var(--glass-radius-panel); }.volume-control,.modal-external-link { border-radius:var(--glass-radius-control); }#persistent-cover { border-radius:var(--glass-radius-control); }.modal-close-btn { border-radius:50%; }
        @media (max-width:620px) {
            #song-detail-modal { overflow:hidden; padding:calc(env(safe-area-inset-top, 0px) + 62px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
            .modal-backdrop { position:fixed; }
            .modal-content-new { position:relative; top:auto; left:auto; width:100%; max-height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 78px); gap:10px; padding:14px; margin:0 auto; transform:none; overflow:hidden; }
            .modal-left { padding:7px; }.cover-label { margin-bottom:5px; }.preview-label { margin-top:6px; }#modal-cover { width:min(100%,25vh,205px); margin:0 auto; }.modal-kicker { margin:0 0 5px; }#modal-artist-name { margin-bottom:5px; }#modal-song-title { font-size:clamp(1.7rem,7vw,2.05rem); }#modal-album-info { margin-top:6px; font-size:.82rem; }.track-timeline { width:100%; margin-top:10px; padding:8px 10px 6px; }.player-controls { margin-top:7px; }.player-utility { width:100%; margin-top:7px; }.player-utility .volume-control,#song-detail-modal #modal-apple-music-link.modal-external-link { height:30px; min-height:30px; }.volume-slider { width:64px; }
            .modal-close-btn { position:fixed; top:calc(env(safe-area-inset-top, 0px) + 72px); right:28px; }
        }
    </style>
</head>

    <main class="app-shell"><header class="site-header"><a class="brand" href="/" aria-label="Now Listening home"><span class="brand-mark"></span><span>NOW LISTENING</span></a><p id="header-note" class="header-note">A small collection of recent plays</p></header><section class="library" aria-labelledby="library-title"><div class="library-heading"><div><p class="eyebrow">SOUNDTRACK</p><h1 id="library-title">Recently played.</h1></div><p class="library-count">30 tracks</p></div><div id="album-grid" aria-live="polite"></div></section></main>
